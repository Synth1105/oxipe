name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oxipe
            asset_name: oxipe-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: oxipe
            asset_name: oxipe-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: oxipe
            asset_name: oxipe-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oxipe
            asset_name: oxipe-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cd dist
          tar czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          generate_release_notes: true

  update-formula:
    name: Update Homebrew Formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Calculate SHA256 for source tarball
        id: source_sha
        run: |
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/v${{ steps.get_version.outputs.VERSION }}.tar.gz" -o source.tar.gz
          echo "SHA=$(sha256sum source.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Formula
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          SOURCE_SHA="${{ steps.source_sha.sha }}"
          REPO="${{ github.repository }}"

          python3 << PYEOF
          import os
          repo = os.environ["REPO"]
          version = os.environ["VERSION"]
          sha = os.environ["SOURCE_SHA"]

          formula = f'''class Oxipe < Formula
            desc "A fast, customizable terminal-based typing speed test and practice application"
            homepage "https://github.com/{repo}"
            url "https://github.com/{repo}/archive/refs/tags/v{version}.tar.gz"
            sha256 "{sha}"
            license "LGPL-2.1"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "oxipe", shell_output("\#{bin}/oxipe --help", 2)
            end
          end
          '''

          with open("Formula/oxipe.rb", "w") as f:
              f.write(formula)
          PYEOF

      - name: Commit and push updated Formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/oxipe.rb
          git commit -m "chore: update formula to v${{ steps.get_version.outputs.VERSION }}" || echo "No changes to commit"
          git push
